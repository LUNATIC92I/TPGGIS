# Proxy TLS devant l'API TPGIS (nginx). Le serveur applicatif n'ecoute que
# sur 127.0.0.1:8000 ; seul ce proxy est joignable depuis le reseau
# institutionnel. La base PostgreSQL n'est jamais exposee.
server {
    listen 443 ssl;
    http2 on;
    server_name tpgis.institution.td;

    ssl_certificate     /etc/tpgis/tls/serveur.crt;
    ssl_certificate_key /etc/tpgis/tls/serveur.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    # Recommande : authentification mutuelle des postes par certificat client
    # emis par l'autorite de certification de l'institution.
    # ssl_client_certificate /etc/tpgis/tls/ac_postes.crt;
    # ssl_verify_client on;

    client_max_body_size 25m;
    server_tokens off;

    # Restreindre aux reseaux institutionnels autorises.
    # allow 10.0.0.0/8;
    # deny all;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name tpgis.institution.td;
    return 301 https://$host$request_uri;
}
