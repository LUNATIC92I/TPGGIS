# Extraits recommandes pour PostgreSQL 16 (serveur central TPGIS).

# postgresql.conf
listen_addresses = 'localhost'          # ou adresse du reseau prive d'administration
password_encryption = scram-sha-256
ssl = on                                # si la base est sur un hote distinct de l'API
log_connections = on
log_disconnections = on
log_statement = 'ddl'
shared_preload_libraries = ''

# pg_hba.conf (seul le compte applicatif, depuis l'hote de l'API)
# TYPE  DATABASE  USER       ADDRESS        METHOD
# local   tpgis     tpgis_app                 scram-sha-256
# host    tpgis     tpgis_app  127.0.0.1/32   scram-sha-256
# hostssl tpgis     tpgis_app  10.10.1.5/32   scram-sha-256   # API sur un autre hote
# (aucune autre ligne ouverte vers l'exterieur)

# Comptes : proprietaire du schema distinct du compte applicatif.
# CREATE ROLE tpgis_proprio NOLOGIN;
# CREATE ROLE tpgis_app LOGIN PASSWORD '...';
# CREATE DATABASE tpgis OWNER tpgis_proprio;
# Les migrations s'executent avec un compte disposant des droits DDL ; en
# exploitation, le compte applicatif n'a besoin que de SELECT, INSERT,
# UPDATE, DELETE sur les tables, sauf sur journal_audit (INSERT et SELECT
# uniquement) :
# REVOKE UPDATE, DELETE, TRUNCATE ON journal_audit FROM tpgis_app;
